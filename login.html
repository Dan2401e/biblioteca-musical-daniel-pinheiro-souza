<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema Musical</title>
    <!-- Conectando o CSS com o HTML -->
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,...🎵...">
</head>
<!-- Conteúdo da página de login -->
<body class="login-page">
    <!-- Div pai -->
    <div class="login-card">
        <!-- Cabeçalho do formulário de login -->
        <div class="login-header">
            <h1>🎵 Sistema Musical</h1>
            <p>Entre com suas credenciais para continuar.</p>
        </div>
        <!-- Formulário de login -->
         <!-- Login Form -->
        <form method="POST" action="#">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" name="username" required placeholder="Digite seu usuário">
            </div>
        <!-- Password Form -->
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" required placeholder="Digite sua senha">
            </div>
        <!-- Botão de envio -->
            <button type="submit" class="btn-primary">Entrar</button>
        </form>
        <!-- Credenciais de login teste -->
        <div class="login-hint">
            <strong>Credenciais de teste:</strong><br>
            Usuário: <code>admin</code> &nbsp;·&nbsp; Senha: <code>123</code>
        </div>
    </div>
</body>
</html>
